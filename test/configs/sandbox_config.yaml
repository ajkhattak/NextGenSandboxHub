# Configuration used by test/sandbox_test.py for the installation smoke test.

general:
  input_dir: "./input"
  output_dir: "./output"
  resource_layout: gage
  domain: conus
  gages:
    option: ids
    ids: ["01308000"]

subsetting:
  hydrofabric:
    version: "2.2"
    gpkg_path: "<path_to>/conus_nextgen.gpkg"
    compute_divide_attributes: false
  vegetation:
    enabled: false
  gages: all

forcings:
  format: ".nc"
  use_corrected: true
  rechunk: true
  time:
    start: "2016-10-01"
    end: "2017-09-30 23:00:00"
  gages: all

observations: {}

calibration:
  optimizer:
    algorithm: dds
    iterations: 1
    random_seed: 444
  objective:
    function: kge

formulations:
  pet_cfe:
    models: "PET, CFE, T-ROUTE"
    verbosity: 0

simulation:
  tasks: [control]
  gages: all
  label: pet_cfe
  time:
    control:
      start: "2016-10-01 00:00:00"
      spinup: "0 hours"
      end: "2016-10-02 23:00:00"
  outputs:
    divide_variables: {}
    metadata:
      enabled: false
      file: simulation_metadata.yml
  partitioning:
    mode: serial
    max_nexus_per_proc: 25
    max_procs: 1
